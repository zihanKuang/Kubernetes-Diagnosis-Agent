# Monitoring Stack Configuration
# This is the infrastructure layer - independent of applications
# Purpose: Provide centralized observability for all applications in the cluster

# Prometheus Operator Configuration
prometheusOperator:
  # Disable admission webhooks to avoid x509 certificate issues on Kind/AKS
  # Trade-off: Less validation but more reliable deployment
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false  # Don't create cert-manager job
  tls:
    enabled: false  # Don't mount TLS secrets

# Alertmanager Configuration
# Host webhook: python -m agent_cli.webhook --host 0.0.0.0 --port 8088
# Token must match CITRUS_WEBHOOK_TOKEN. Change before any non-demo use.
# Kind/Docker Desktop: Alertmanager POSTs to host.docker.internal.
# If that hostname does not route, use curl (docs/WEBHOOK.md) — do not
# deploy the Agent in-cluster just to receive alerts.
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: citrus-webhook
          matchers:
            - alertname = CitrusPodNotReady
    receivers:
      - name: "null"
      - name: citrus-webhook
        webhook_configs:
          - url: http://host.docker.internal:8088/webhook
            send_resolved: true
            http_config:
              bearer_token: "change-me"
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Grafana Configuration
grafana:
  enabled: true
  adminPassword: prom-operator  # Default password for demo
  persistence:
    enabled: false  # Ephemeral storage for local development
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Prometheus Configuration
prometheus:
  enabled: true
  prometheusSpec:
    # Accept OTLP/HTTP metrics pushed by the OpenTelemetry Collector.
    # The Collector uses /api/v1/otlp as its base URL and appends /v1/metrics.
    enableOTLPReceiver: true

    # CRITICAL: Allow Prometheus to discover ServiceMonitors in all namespaces
    # Without this, application metrics won't be scraped
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}  # Empty = watch all namespaces
    # Pick up PrometheusRule objects in citrus (infra/alerting/*.yaml)
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    
    # Resource limits
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    
    # Storage
    storageSpec: {}  # Ephemeral storage - acceptable for non-production
    
    # Retention
    retention: 7d  # Keep metrics for 7 days
