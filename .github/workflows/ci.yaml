name: CI - Infrastructure as Code Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-helm-configs:
    name: Validate Helm Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Add Helm Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Validate Monitoring Stack Values
        run: |
          helm template monitoring prometheus-community/kube-prometheus-stack \
            --values deploy/helm/monitoring-stack-values.yaml \
            --dry-run > /dev/null
          echo "Monitoring stack values are valid"

      - name: Validate Jaeger Values
        run: |
          helm template jaeger jaegertracing/jaeger \
            --values deploy/helm/jaeger-values.yaml \
            --dry-run > /dev/null
          echo "Jaeger values are valid"

      - name: Validate OpenTelemetry Demo Values
        run: |
          helm template otel-demo open-telemetry/opentelemetry-demo \
            --version 0.40.9 \
            --values deploy/helm/otel-demo-values.yaml \
            --dry-run > /dev/null
          echo "OpenTelemetry Demo values are valid"

  run-unit-tests:
    name: Run Agent/MCP Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install components (editable)
        run: |
          pip install -e "components[test,langgraph]"
          pip install -e "components/mcp-server[test]"

      - name: Run tests
        working-directory: components
        run: python -m pytest agent_cli/tests mcp-server/tests -v

      - name: Validate builtin Skills
        working-directory: components
        run: python -m agent_cli.skills validate

      - name: Check Skill resources in the tree
        working-directory: components
        run: |
          python -c "from importlib.resources import files; root=files('agent_cli.skills.builtin'); assert (root/'generic-triage'/'SKILL.toml').is_file(); print('builtin skills packaged')"

      - name: Build wheel and check packaged Skills
        working-directory: components
        run: |
          pip install build
          rm -rf build
          python -m build --wheel --outdir /tmp/citrus-skill-wheel
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("/tmp/citrus-skill-wheel/*.whl")
          assert wheels, "no wheel produced"
          names = zipfile.ZipFile(wheels[0]).namelist()
          tests = [n for n in names if "/tests/" in n]
          assert not tests, tests[:8]
          assert any(n.endswith("generic-triage/SKILL.toml") for n in names)
          assert any(n.endswith("fragments/scan.toml") for n in names)
          print("wheel ok", wheels[0], "files", len(names))
          PY

  validate-deployment-scripts:
    name: Validate Deployment Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PowerShell
        run: |
          # PowerShell is pre-installed on ubuntu-latest

      - name: Syntax Check - Deploy All
        run: |
          pwsh -Command "Test-Path scripts/deployment/0-deploy-all.ps1"
          pwsh -Command "Get-Command scripts/deployment/0-deploy-all.ps1" || echo "Script syntax valid"

      - name: Syntax Check - Deploy Infrastructure
        run: |
          pwsh -Command "Test-Path scripts/deployment/1-deploy-infrastructure.ps1"
          pwsh -Command "Get-Command scripts/deployment/1-deploy-infrastructure.ps1" || echo "Script syntax valid"

      - name: Syntax Check - Deploy Application
        run: |
          pwsh -Command "Test-Path scripts/deployment/2-deploy-application.ps1"
          pwsh -Command "Get-Command scripts/deployment/2-deploy-application.ps1" || echo "Script syntax valid"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate-helm-configs, run-unit-tests, validate-deployment-scripts]
    if: always()

    steps:
      - name: Check Results
        run: |
          echo "========================================="
          echo "CI Validation Summary"
          echo "========================================="
          echo "Helm Configs: ${{ needs.validate-helm-configs.result }}"
          echo "Unit Tests: ${{ needs.run-unit-tests.result }}"
          echo "Deployment Scripts: ${{ needs.validate-deployment-scripts.result }}"
          echo "========================================="
          
          if [ "${{ needs.validate-helm-configs.result }}" != "success" ]; then
            echo "Helm configuration validation failed"
            exit 1
          fi
          
          if [ "${{ needs.run-unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          
          if [ "${{ needs.validate-deployment-scripts.result }}" != "success" ]; then
            echo "Deployment script validation failed"
            exit 1
          fi
          
          echo "All validations passed!"
