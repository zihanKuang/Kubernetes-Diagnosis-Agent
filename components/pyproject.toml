[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citrus-agent-cli"
version = "0.2.0"
description = "Hand-written ReAct agent CLI (OpenAI-compatible tool calling: DeepSeek hosted or self-hosted vLLM) for Citrus MCP diagnostics."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
metrics = ["prometheus-client>=0.20"]
langgraph = ["langgraph>=0.2"]
review = ["openevals>=0.0.19"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["agent_cli*"]
exclude = ["agent_cli.tests", "agent_cli.tests.*"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.md"]
# Skill directories are data, not Python packages (several ids are not identifiers).
"agent_cli.skills.builtin" = ["*/*.toml", "*/*.md", "fragments/*.toml"]
"agent_cli.skill_bench" = ["adapted_instructions/*/*.md", "FINGERPRINTS.json"]
