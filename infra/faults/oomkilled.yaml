# OOMKilled fixture. Not Chaos Mesh.
# The shell doubles a string until the 32Mi limit kills it. After the kill the
# waiting reason is often CrashLoopBackOff; last termination stays OOMKilled.
#
# Apply:  kubectl apply -f infra/faults/oomkilled.yaml
# Delete: kubectl delete -f infra/faults/oomkilled.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citrus-oom
  namespace: citrus
  labels:
    app: citrus-fault
    citrus.dev/fault-fixture: "true"
    experiment: oomkilled-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: citrus-oom
  template:
    metadata:
      labels:
        app.kubernetes.io/component: citrus-oom
        app: citrus-fault
        citrus.dev/fault-fixture: "true"
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: oom
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo citrus-oom-fixture; blob=x; while true; do blob=$blob$blob; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
