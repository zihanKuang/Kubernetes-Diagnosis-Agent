# Readiness-failure fixture. Not Chaos Mesh.
# The process sleeps (no restarts). The readiness probe exits 1, so the pod
# stays Running and not Ready. There is no liveness probe, so this is not a crash loop.
#
# Apply:  kubectl apply -f infra/faults/probe-not-ready.yaml
# Delete: kubectl delete -f infra/faults/probe-not-ready.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citrus-probe
  namespace: citrus
  labels:
    app: citrus-fault
    citrus.dev/fault-fixture: "true"
    experiment: probe-not-ready
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: citrus-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/component: citrus-probe
        app: citrus-fault
        citrus.dev/fault-fixture: "true"
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: probe
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sleep", "3600"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "exit 1"]
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
